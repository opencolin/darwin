<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Theme before paint: an explicit choice wins; otherwise the system preference applies via CSS. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('darwin.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <!-- Static fallback; `<Seo />` (src/client/seo.config.ts) sets the title at runtime. -->
    <title>Darwin</title>
    <meta name="theme-color" content="#f3ede1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darwin" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
